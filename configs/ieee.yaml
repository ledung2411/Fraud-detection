# Real data: Kaggle "IEEE-CIS Fraud Detection" (see data/README.md for download).
data:
  source: ieee
  transaction_path: data/raw/ieee-fraud-detection/train_transaction.csv
  identity_path: data/raw/ieee-fraud-detection/train_identity.csv
  cache_path: data/processed/ieee.parquet

split:
  valid_days: 30   # month used for early stopping + threshold + drift reference
  test_days: 30    # last month, only used for reporting
  gap_days: 0      # set e.g. 14 to mimic labels (chargebacks) arriving late

features:
  entities:
    card1: [card1]               # card BIN-like group: catches BIN attacks / card testing
    uid: [card1, addr1, D1n]     # client proxy: catches bursts on one account
  windows: {1h: 3600, 24h: 86400, 7d: 604800}
  freq_encode: [card1, card2, card3, card5, addr1, P_emaildomain, R_emaildomain, DeviceInfo]
  min_category_count: 20
  drop: []

evaluation:
  review_budget: 0.01            # analysts can review 1% of transactions
  budgets: [0.005, 0.01, 0.02, 0.05]
  bootstrap: 200
  seed: 42

models:
  logreg:
    C: 0.1
    max_iter: 1000
    # Random subsample of the train period: the dense design matrix (~1,600 columns
    # after missing-value indicators and one-hot) would need >6 GB on all 470k rows,
    # and a linear model gains little from more rows. LightGBM uses every row.
    max_train_rows: 250000
  lightgbm:
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 100
    feature_fraction: 0.4
    n_estimators: 3000
    early_stopping_rounds: 150

explain:
  sample_size: 2000            # TreeSHAP cost grows with trees x leaves x depth^2
  top_k_reasons: 5

drift:
  n_bins: 10
  max_categories: 20
  warn: 0.1
  alert: 0.25

output:
  artifact_dir: artifacts/ieee
  report_dir: reports/ieee
