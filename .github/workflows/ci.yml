name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      # Trains all four models on a small synthetic dataset, serves the API and
      # replays traffic through it, so the whole pipeline is exercised on every push.
      - run: pytest
